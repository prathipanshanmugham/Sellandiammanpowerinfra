# /etc/nginx/sites-available/sellandiammanpowerinfra  (then: ln -s ... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx;
# certbot --nginx -d sellandiammanpowerinfra.com -d www.sellandiammanpowerinfra.com adds HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name sellandiammanpowerinfra.com www.sellandiammanpowerinfra.com;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
